<!DOCTYPE html>
<html lang="en">
<head>

<title>Get started | Deskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

<body class="page-form">

<main class="form-shell">

  <a class="back-pill ripple" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>

  <header class="form-head">
    <h1 class="form-head-title">Get started</h1>
    <p class="form-head-sub">Create a new Desk, or log in to yours.</p>
  </header>

  <div class="type-list">

    <a class="type-card ripple" href="signup.html">
      <span class="type-badge">+</span>
      <span class="type-info">
        <span class="type-title">Create a Desk</span>
        <span class="type-sub">New here. Start fresh.</span>
      </span>
    </a>

    <a class="type-card ripple" href="login.html">
      <span class="type-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
        </svg>
      </span>
      <span class="type-info">
        <span class="type-title">Log in</span>
        <span class="type-sub">Already have an account.</span>
      </span>
    </a>

  </div>

</main>

<script src="ripple.js" defer></script>
