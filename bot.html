<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>My bot | Deskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#01764C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STMDeskly">
<meta name="application-name" content="STMDeskly">
<meta property="og:image" content="https://stmdeskly.pages.dev/og-image.png">
</head>

<body class="page-form signed-in page-bot">

<main class="form-shell" id="botRoot" style="display:none; max-width:640px;">

  <header class="settings-head" style="grid-template-columns:40px 1fr auto;">
    <a class="page-back" href="dashboard.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <h1 class="settings-title">My bot</h1>
    <a class="preview-btn ripple" id="viewDeskBtn" href="#" target="_blank" rel="noopener" aria-label="View my Desk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span>View Desk</span>
    </a>
  </header>

  <div class="owner-bot-wrap">
    <div class="desk-bot-log" id="ownerLog" role="log" aria-live="polite"></div>
    <div class="desk-bot-chips" id="ownerChips"></div>

    <form class="desk-bot-input-row" id="ownerForm">
      <input
        type="text"
        class="desk-bot-input"
        id="ownerInput"
        placeholder="Say something to your bot..."
        aria-label="Message"
        autocomplete="off"
      >
      <button type="submit" class="desk-bot-send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </button>
    </form>
  </div>

</main>

<div class="dash-loading" id="botLoading">
  <div class="skeleton skeleton-title"></div>
  <div class="skeleton skeleton-line"></div>
  <div class="skeleton skeleton-line short"></div>
  <div class="skeleton skeleton-block"></div>
</div>

<div class="form-shell" id="noAuth" style="display:none; text-align:center;">
  <h1 class="form-head-title" style="margin-top:80px;">Not logged in</h1>
  <p class="form-head-sub" style="margin-bottom:28px;">You need to be logged in to see this page.</p>
  <a class="btn btn-primary ripple" href="login.html">Log in</a>
</div>

<script src="config.js"></script>
<script src="supabase.js?v=4"></script>
<script src="how-to.js"></script>
<script src="bot.js" defer></script>
<script src="header.js" defer></script>
  <script src="toast.js"></script>
<script src="ripple.js" defer></script>

<script>
  /* Wire the "View Desk" button once we know the username */
  (function wireViewDesk(){
    const btn = document.getElementById('viewDeskBtn');
    if (!btn) return;

    async function setLink(){
      try {
        /* Wait for DB to be ready */
        let tries = 0;
        while ((!window.DB || !DB.ready) && tries < 40) {
          await new Promise(r => setTimeout(r, 100));
          tries++;
        }
        if (!window.DB || !DB.ready || !DB.currentUser()) return;

        const desk = await DB.getMyDesk();
        if (!desk || !desk.username) {
          btn.style.display = 'none';
          return;
        }

        const base = (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.siteUrl) || location.origin;
        const url = base + '/desk.html?u=' + encodeURIComponent(desk.username) + '&bot=1';
        btn.href = url;
      } catch(e) {
        btn.style.display = 'none';
      }
    }

    setLink();
  })();
</script>

</body>
</html>
