<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F0EA">
<title>Explore | Deskly</title>
<meta name="description" content="Find people, businesses and gigs on Deskly.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#01764C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STMDeskly">
<meta name="application-name" content="STMDeskly">
<meta property="og:image" content="https://stmdeskly.pages.dev/og-image.png">
</head>

<body class="page-form signed-in">

<main id="exploreRoot" class="form-shell">

  <header class="explore-head">
    <h1 class="explore-title">Explore</h1>
    <p class="explore-sub">Find anyone. Find any gig.</p>

    <div class="explore-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input
        type="search"
        id="exploreInput"
        placeholder="Search a name, role, or @link"
        autocomplete="off"
        aria-label="Search"
      >
    </div>

    <p class="explore-hint">
      Type <strong>@yourlink</strong> to jump to someone's profile, or search a name to see everyone.
    </p>

    <div class="explore-tabs" id="exploreTabs">
      <button type="button" class="explore-tab active" data-tab="all">All</button>
      <button type="button" class="explore-tab" data-tab="desks">Desks</button>
      <button type="button" class="explore-tab" data-tab="gigs">Gigs</button>
    </div>
  </header>

  <div class="explore-content">

    <div class="explore-popular" id="explorePopular">
      <div class="explore-popular-label">Popular searches</div>
      <div class="explore-popular-chips">
        <button type="button" class="explore-popular-chip" data-query="photographer lagos">Photographers in Lagos</button>
        <button type="button" class="explore-popular-chip" data-query="tailor under 20k">Tailors under ₦20k</button>
        <button type="button" class="explore-popular-chip" data-query="keyboardist sunday">Keyboardists for Sunday</button>
        <button type="button" class="explore-popular-chip" data-query="caterer">Caterers</button>
        <button type="button" class="explore-popular-chip" data-query="phone repair ikeja">Phone repair in Ikeja</button>
      </div>
    </div>

    <div class="explore-results" id="exploreResults" hidden>

      <section class="explore-section" id="exploreDesksSection" hidden>
        <h2 class="explore-section-title" id="exploreDesksTitle">Desks</h2>
        <div class="explore-grid" id="exploreDesksGrid"></div>
      </section>

      <section class="explore-section" id="exploreGigsSection" hidden>
        <h2 class="explore-section-title" id="exploreGigsTitle">Gigs</h2>
        <div class="explore-gigs" id="exploreGigsList"></div>
      </section>

      <div class="explore-empty" id="exploreEmpty" hidden>
        <p class="explore-empty-title">Nothing found</p>
        <p class="explore-empty-sub" id="exploreEmptySub">Try different words, or clear the filters.</p>
      </div>

    </div>

    <div class="explore-status" id="exploreStatus">Loading…</div>

  </div>

  <footer class="home-footer">
    <a href="index.html" class="home-footer-link">Deskly</a>
    <span class="home-footer-sep">·</span>
    <a href="explore.html" class="home-footer-link">Explore</a>
  </footer>

</main>

<script src="config.js"></script>
<script src="supabase.js?v=4"></script>
<script src="search-parser.js"></script>
<script src="explore.js" defer></script>
<script src="tabbar.js?v=5" defer></script>
<script src="ripple.js" defer></script>

</body>
</html>
