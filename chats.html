<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F8F9F7">
<title>Inbox | STMDeskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=19">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STMDeskly">
<meta name="application-name" content="STMDeskly">
<meta property="og:image" content="https://stmdeskly.pages.dev/og-image.png">
</head>

<body class="page-form signed-in page-chats">

<main class="form-shell" id="chatsRoot" style="display:none">

  <header class="chats-head">
    <div class="chats-head-top">
      <h1 class="chats-title">Inbox</h1>
    </div>

    <div class="chats-tabs" id="chatsTabs">
      <div class="chats-tabs-pill" id="chatsPill"></div>

      <button type="button" class="chats-tab active" data-tab="chats">
        Inbox
        <span class="chats-tab-badge" id="chatsBadge" hidden>0</span>
      </button>

      <button type="button" class="chats-tab" data-tab="requests">
        Requests
        <span class="chats-tab-badge" id="requestsBadge" hidden>0</span>
      </button>

      <button type="button" class="chats-tab" data-tab="updates">
        Updates
      </button>

      <button type="button" class="chats-tab" data-tab="archived">
        Archived
      </button>

      <button type="button" class="chats-tab chats-tab-add" id="chatsTabAdd" aria-label="Add or manage tabs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="chats-body">

    <div class="chats-loading" id="chatsLoading">
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div>
    </div>

    <div class="chats-empty" id="chatsEmpty" hidden>
      <div class="chats-empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-5.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"/>
        </svg>
      </div>
      <p class="chats-empty-title" id="chatsEmptyTitle">No chats yet</p>
      <p class="chats-empty-sub" id="chatsEmptySub">Find someone on Explore and tap Message to start a conversation.</p>
      <a class="chats-empty-btn ripple" id="chatsEmptyBtn" href="explore.html">Explore STMDeskly</a>
    </div>

    <div class="chats-list" id="chatsList"></div>

  </div>

</main>

<div class="form-shell" id="noAuth" style="display:none; text-align:center;">
  <h1 class="form-head-title" style="margin-top:80px;">Not logged in</h1>
  <p class="form-head-sub" style="margin-bottom:28px;">You need to be logged in to see your chats.</p>
  <a class="btn btn-primary ripple" href="login.html">Log in</a>
</div>

<script src="config.js"></script>
<script src="supabase.js?v=12"></script>
<script src="notifications.js"></script>
<script src="presence.js"></script>
<script src="header.js" defer></script>
<script src="chats-v2.js?v=16" defer></script>
<script src="tabbar.js?v=9" defer></script>
<script src="toast.js"></script>
<script src="ripple.js" defer></script>

<script>
  (async function waitForDb(){
    for (let i = 0; i < 40; i++) {
      if (window.DB && DB.ready && DB.currentUser() && window.PRESENCE) {
        PRESENCE.startHeartbeat();
        return;
      }
      await new Promise(r => setTimeout(r, 100));
    }
  })();
</script>

</body>
</html>
