<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F0EA">
<title>Gig | Deskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#01764C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STMDeskly">
<meta name="application-name" content="STMDeskly">
<meta property="og:image" content="https://stmdeskly.pages.dev/og-image.png">
</head>

<body class="page-desk">

<div class="desk-topbar">
  <button type="button" class="desk-float-btn desk-float-back ripple" id="gigBack" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>
</div>

<main id="gigRoot" style="display:none">

  <header class="brand-band">
    <div class="brand-band-inner">
      <div class="gig-type-badge" id="gigTypeBadge">Looking for</div>
      <h1 class="desk-name" id="gigTitleEl">—</h1>
      <p class="desk-role" id="gigRoleEl">—</p>
      <p class="desk-tagline" id="gigPostedEl"></p>
    </div>
  </header>

  <div class="content-band">

    <section class="desk-block" id="gigBodyBlock" hidden>
      <h2 class="desk-block-title">Details</h2>
      <p class="desk-copy" id="gigBodyEl"></p>
    </section>

    <section class="desk-block" id="gigInfoBlock" hidden>
      <h2 class="desk-block-title">Info</h2>
      <div class="desk-details">
        <div class="desk-detail" id="gigLocBlock" hidden>
          <div class="desk-detail-label">Location</div>
          <div class="desk-detail-value" id="gigLocEl"></div>
        </div>
        <div class="desk-detail" id="gigDaysBlock" hidden>
          <div class="desk-detail-label">Days</div>
          <div class="desk-detail-value" id="gigDaysEl"></div>
        </div>
        <div class="desk-detail" id="gigPayBlock" hidden>
          <div class="desk-detail-label">Pay</div>
          <div class="desk-detail-value" id="gigPayEl"></div>
        </div>
      </div>
    </section>

    <section class="desk-block" id="gigContactBlock">
      <h2 class="desk-block-title">Contact</h2>
      <p class="desk-copy" style="margin-bottom:14px;" id="gigContactIntro"></p>
      <div class="desk-actions">
        <a class="desk-btn desk-btn-primary ripple" id="gigWhatsApp" href="#" target="_blank" rel="noopener">Message on WhatsApp</a>
        <a class="desk-btn desk-btn-secondary ripple" id="gigDeskLink" href="#">View full Desk</a>
      </div>
    </section>

    <section class="desk-block" id="gigOwnerBlock" hidden>
      <h2 class="desk-block-title">Owner options</h2>
      <div class="desk-actions">
        <a class="desk-btn desk-btn-secondary ripple" id="gigEditBtn" href="#">Edit gig</a>
        <button type="button" class="desk-btn desk-btn-secondary ripple" id="gigCloseBtn">Mark as filled</button>
        <button type="button" class="desk-btn desk-btn-secondary ripple" id="gigDeleteBtn" style="color:#8B3217;border-color:#E8D5CE;">Delete gig</button>
      </div>
    </section>

    <section class="desk-block" id="gigReportBlock" hidden>
      <h2 class="desk-block-title">Something wrong?</h2>
      <div class="desk-actions">
        <button type="button" class="desk-btn desk-btn-secondary ripple" id="gigReportBtn">Report this gig</button>
      </div>
    </section>

  </div>

  <footer class="desk-footer">
    <a href="index.html" class="desk-footer-brand">Made with Deskly</a>
    <a href="explore.html" class="desk-footer-cta">Explore</a>
  </footer>

</main>

<div class="desk-missing" id="gigMissing" style="display:none">
  <h1>Gig not found</h1>
  <p>This gig doesn&rsquo;t exist, or it&rsquo;s expired.</p>
  <a class="btn btn-primary ripple" href="explore.html">Explore other gigs</a>
</div>

<script src="config.js"></script>
<script src="supabase.js?v=4"></script>
<script src="gig.js" defer></script>
<script src="ripple.js" defer></script>

</body>
</html>
