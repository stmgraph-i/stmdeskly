<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F8F9F7">
<title>Reset password | STMDeskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#01764C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STMDeskly">
<meta name="application-name" content="STMDeskly">
<meta property="og:image" content="https://stmdeskly.pages.dev/og-image.png">
</head>

<body class="page-form">

<main class="form-shell">

  <a class="back-pill ripple" href="login.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>

  <header class="form-head">
    <h1 class="form-head-title">Forgot your password?</h1>
    <p class="form-head-sub">Enter your email and we'll send you a link to set a new one.</p>
  </header>

  <form class="form" id="forgotForm" novalidate>

    <div class="form-fields" style="margin-top:0;">

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="form-message" id="formMessage" hidden></div>

      <button type="submit" class="form-submit ripple" id="submitBtn">
        <span class="submit-text" id="submitText">Send reset link</span>
      </button>

      <p class="form-alt">Remembered it? <a href="login.html">Back to log in</a></p>

    </div>

  </form>

</main>

<script src="config.js"></script>
<script src="supabase.js?v=4"></script>
<script src="rate-limit.js"></script>
<script>
  (function initForgot(){

    const form       = document.getElementById('forgotForm');
    const messageBox = document.getElementById('formMessage');
    const submitBtn  = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');

    function showMessage(text, kind){
      messageBox.textContent = text;
      messageBox.className = 'form-message ' + (kind || 'error');
      messageBox.hidden = false;
    }
    function clearMessage(){ messageBox.hidden = true; messageBox.textContent = ''; }

    function setLoading(on, text){
      if (on) {
        submitBtn.disabled = true;
        submitText.innerHTML = '<span class="spinner"></span>' + (text || 'Working...');
      } else {
        submitBtn.disabled = false;
        submitText.textContent = 'Send reset link';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const email = document.getElementById('email').value.trim();

      if (!email) return showMessage('Please enter your email.');
      if (!DB.isValidEmail(email)) return showMessage('Please enter a valid email address.');
      if (!window.DB || !window.DB.ready) return showMessage('Database not connected yet.');

      const before = RATE.check('forgot');
      if (before.blocked) {
        return showMessage('Too many reset requests. Please wait ' + RATE.prettyTime(before.secondsLeft) + ' and try again.');
      }

      setLoading(true, 'Sending...');

      try {
        await DB.recoverPassword(email);
        RATE.reset('forgot');
        setLoading(false);
        showMessage('If that email exists, we\'ve sent a reset link. Check your inbox and spam.', 'success');
        form.reset();
      } catch (err) {
        console.error(err);
        setLoading(false);

        const after = RATE.record('forgot');
        if (after.blocked) {
          showMessage('Too many reset requests. Please wait ' + RATE.prettyTime(after.secondsLeft) + ' and try again.');
        } else if (after.remaining <= 2) {
          const tries = after.remaining === 1 ? '1 try left' : after.remaining + ' tries left';
          showMessage((err.message || 'Could not send the reset link.') + ' You have ' + tries + '.');
        } else {
          showMessage(err.message || 'Could not send the reset link.');
        }
      }
    });

  })();

  (async function redirectIfLoggedIn(){
    let tries = 0;
    while ((!window.DB || !DB.ready) && tries < 40) {
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if (window.DB && DB.ready && DB.currentUser()) {
      window.location.replace('dashboard.html');
    }
  })();
</script>
<script src="toast.js"></script>
<script src="ripple.js" defer></script>

</body>
</html>
