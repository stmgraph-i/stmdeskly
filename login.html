<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Log in | Deskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#01764C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STMDeskly">
<meta name="application-name" content="STMDeskly">
<meta property="og:image" content="https://stmdeskly.pages.dev/og-image.png">
</head>

<body class="page-form">

<main class="form-shell">

  <a class="back-pill ripple" href="index.html" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>

  <header class="form-head">
    <h1 class="form-head-title">Log in</h1>
    <p class="form-head-sub">Welcome back.</p>
  </header>

  <form class="form" id="loginForm" novalidate>

    <div class="form-fields" style="margin-top:0;">

      <div class="accounts-box" id="accountsBox" hidden>
        <div class="accounts-label">Continue as</div>
        <div class="accounts-list" id="accountsList"></div>
        <button type="button" class="accounts-other" id="otherAccountBtn">Use a different account</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe">
        <span>Remember me on this device</span>
      </label>

      <div class="form-message" id="formMessage" hidden></div>

      <button type="submit" class="form-submit ripple" id="submitBtn">
        <span class="submit-text" id="submitText">Log in</span>
      </button>

      <p class="form-alt">New here? <a href="signup.html">Create a Desk</a></p>
      <p class="form-alt"><a href="forgot.html">Forgot your password?</a></p>
      <p class="form-alt form-alt-small">
        <a href="terms.html">Terms &amp; Privacy</a>
      </p>

    </div>

  </form>

</main>

<script src="config.js"></script>
<script src="supabase.js?v=4"></script>
<script src="rate-limit.js"></script>
<script>
  (function initLogin(){

    const form       = document.getElementById('loginForm');
    const messageBox = document.getElementById('formMessage');
    const submitBtn  = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');
    const passwordEl = document.getElementById('password');
    const emailEl    = document.getElementById('email');
    const pwToggle   = document.getElementById('pwToggle');
    const rememberEl = document.getElementById('rememberMe');
    const accountsBox  = document.getElementById('accountsBox');
    const accountsList = document.getElementById('accountsList');
    const otherBtn     = document.getElementById('otherAccountBtn');

    function showMessage(text, kind){
      messageBox.textContent = text;
      messageBox.className = 'form-message ' + (kind || 'error');
      messageBox.hidden = false;
    }
    function clearMessage(){ messageBox.hidden = true; messageBox.textContent = ''; }

    function setLoading(on, text){
      if (on) {
        submitBtn.disabled = true;
        submitText.innerHTML = '<span class="spinner"></span>' + (text || 'Working...');
      } else {
        submitBtn.disabled = false;
        submitText.textContent = 'Log in';
      }
    }

    if (pwToggle) {
      pwToggle.setAttribute('data-state', 'hidden');
      pwToggle.addEventListener('click', () => {
        const showing = passwordEl.type === 'text';
        passwordEl.type = showing ? 'password' : 'text';
        pwToggle.setAttribute('data-state', showing ? 'hidden' : 'shown');
        pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    }

    function renderAccounts(){
      if (!accountsList || !window.DB) return;
      const accounts = DB.knownAccounts();
      if (!accounts.length) {
        accountsBox.hidden = true;
        return;
      }
      accountsBox.hidden = false;
      accountsList.innerHTML = '';

      accounts.forEach(acc => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'account-card';

        const av = document.createElement('div');
        av.className = 'account-avatar';
        if (acc.avatar_url) {
          av.style.backgroundImage = 'url("' + acc.avatar_url + '")';
          av.style.backgroundSize = 'cover';
          av.style.backgroundPosition = 'center';
          av.textContent = '';
        } else {
          const fallback = (acc.initials || acc.name || acc.email || '?').trim();
          av.textContent = fallback.charAt(0).toUpperCase() || '?';
        }
        card.appendChild(av);

        const info = document.createElement('div');
        info.className = 'account-info';

        const displayName = (acc.name && acc.name.trim())
          ? acc.name.trim()
          : (acc.email ? acc.email.split('@')[0] : 'Account');

        const nameEl = document.createElement('div');
        nameEl.className = 'account-name';
        nameEl.textContent = displayName;
        info.appendChild(nameEl);

        const emailLine = document.createElement('div');
        emailLine.className = 'account-email';
        emailLine.textContent = acc.email || '';
        info.appendChild(emailLine);

        card.appendChild(info);

        card.addEventListener('click', () => {
          emailEl.value = acc.email || '';
          passwordEl.value = '';
          passwordEl.focus();
          clearMessage();
        });

        accountsList.appendChild(card);
      });
    }

    if (otherBtn) {
      otherBtn.addEventListener('click', () => {
        emailEl.value = '';
        passwordEl.value = '';
        emailEl.focus();
        clearMessage();
      });
    }

    renderAccounts();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const email    = emailEl.value.trim();
      const password = passwordEl.value;

      if (!email || !password) return showMessage('Email and password are required.');
      if (!DB.isValidEmail(email)) return showMessage('Please enter a valid email address.');
      if (!window.DB || !window.DB.ready) return showMessage('Database not connected yet.');

      const before = RATE.check('login');
      if (before.blocked) {
        return showMessage('Too many attempts. Please wait ' + RATE.prettyTime(before.secondsLeft) + ' and try again.');
      }

      setLoading(true, 'Logging in...');

      try {
        await DB.logIn(email, password);
        DB.persistLogin(!!rememberEl.checked);

        try {
          const desk = await DB.getMyDesk();
          if (desk) {
            DB.rememberAccount(email, {
              name: desk.name || '',
              initials: desk.initials || '',
              avatar_url: desk.avatar_url || ''
            });
          } else {
            DB.rememberAccount(email, {});
          }
        } catch(e) {
          DB.rememberAccount(email, {});
        }

        RATE.reset('login');
        window.location.replace('home.html');
      } catch (err) {
        console.error(err);
        setLoading(false);

        const after = RATE.record('login');
        if (after.blocked) {
          showMessage('Too many attempts. Please wait ' + RATE.prettyTime(after.secondsLeft) + ' and try again.');
        } else {
          const tries = after.remaining === 1 ? '1 try left' : after.remaining + ' tries left';
          showMessage('Invalid email or password. ' + tries + '.');
        }
      }
    });

  })();

  /* Auth guard — bounce logged-in users to home */
  (async function redirectIfLoggedIn(){
    let tries = 0;
    while ((!window.DB || !DB.ready) && tries < 40) {
      await new Promise(r => setTimeout(r, 100));
      tries++;
    }
    if (window.DB && DB.ready && DB.currentUser()) {
      window.location.replace('home.html');
    }
  })();
</script>

<script src="ripple.js" defer></script>

</body>
</html>
