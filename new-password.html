<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Set new password | Deskly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#01764C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STMDeskly">
<meta name="application-name" content="STMDeskly">
<meta property="og:image" content="https://stmdeskly.pages.dev/og-image.png">
</head>

<body class="page-form">

<main class="form-shell">

  <header class="form-head">
    <h1 class="form-head-title">Set a new password</h1>
    <p class="form-head-sub">Choose a password you'll remember. At least 8 characters.</p>
  </header>

  <form class="form" id="newPasswordForm" novalidate>

    <div class="form-fields" style="margin-top:0;">

      <div class="form-group">
        <label class="form-label" for="password">New password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="password" placeholder="8+ characters" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>
        <div class="pw-meter" id="pwMeter" hidden>
          <div class="pw-meter-bars">
            <span class="pw-bar"></span>
            <span class="pw-bar"></span>
            <span class="pw-bar"></span>
            <span class="pw-bar"></span>
          </div>
          <div class="pw-meter-label" id="pwLabel"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm">Confirm password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="confirm" placeholder="Same password again" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" id="confirmToggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-message" id="formMessage" hidden></div>

      <button type="submit" class="form-submit ripple" id="submitBtn">
        <span class="submit-text" id="submitText">Save new password</span>
      </button>

      <p class="form-alt"><a href="login.html">Back to log in</a></p>

    </div>

  </form>

</main>

<script src="config.js"></script>
<script src="supabase.js?v=4"></script>
<script src="password-strength.js"></script>
<script>
  (function initNewPassword(){

    const form       = document.getElementById('newPasswordForm');
    const messageBox = document.getElementById('formMessage');
    const submitBtn  = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');

    const passwordEl  = document.getElementById('password');
    const confirmEl   = document.getElementById('confirm');
    const pwMeter     = document.getElementById('pwMeter');
    const pwLabel     = document.getElementById('pwLabel');
    const pwToggle    = document.getElementById('pwToggle');
    const confToggle  = document.getElementById('confirmToggle');

    function showMessage(text, kind){
      messageBox.textContent = text;
      messageBox.className = 'form-message ' + (kind || 'error');
      messageBox.hidden = false;
    }
    function clearMessage(){ messageBox.hidden = true; messageBox.textContent = ''; }

    function setLoading(on, text){
      if (on) {
        submitBtn.disabled = true;
        submitText.innerHTML = '<span class="spinner"></span>' + (text || 'Working...');
      } else {
        submitBtn.disabled = false;
        submitText.textContent = 'Save new password';
      }
    }

    function updateMeter(){
      const pw = passwordEl.value;
      if (!pw) { pwMeter.hidden = true; return; }
      pwMeter.hidden = false;
      const s = PASSWORD.score(pw);
      pwMeter.setAttribute('data-score', String(s));
      pwLabel.textContent = PASSWORD.label(s);
    }

    passwordEl.addEventListener('input', updateMeter);

    function wireToggle(btn, input){
      if (!btn || !input) return;
      btn.setAttribute('data-state', 'hidden');
      btn.addEventListener('click', () => {
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.setAttribute('data-state', showing ? 'hidden' : 'shown');
        btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });
    }

    wireToggle(pwToggle, passwordEl);
    wireToggle(confToggle, confirmEl);

    function captureRecoveryToken(){
      const hash = window.location.hash.substring(1);
      if (!hash) return false;
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      if (!accessToken) return false;

      try {
        localStorage.setItem('fd_session', JSON.stringify({
          access_token: accessToken,
          refresh_token: refreshToken || '',
          token_type: 'bearer',
          user: null
        }));
      } catch(e) {}
      return true;
    }

    const hasToken = captureRecoveryToken();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const password = passwordEl.value;
      const confirm  = confirmEl.value;

      const check = PASSWORD.validate(password);
      if (!check.ok) return showMessage(check.errors[0]);

      if (password !== confirm) return showMessage('The two passwords do not match.');
      if (!window.DB || !window.DB.ready) return showMessage('Database not connected yet.');

      if (!hasToken) {
        return showMessage('This reset link is invalid or has expired. Please request a new one from the login page.');
      }

      setLoading(true, 'Just a moment...');

      try {
        const breached = await PASSWORD.isBreached(password);
        if (breached) {
          setLoading(false);
          return showMessage('That password isn\u2019t safe. Try a different one.');
        }

        setLoading(true, 'Saving...');
        await DB.updatePassword(password);
        DB.logOut();
        setLoading(false);
        showMessage('Password changed. Redirecting to log in…', 'success');
        setTimeout(() => { window.location.replace('login.html'); }, 1500);
      } catch (err) {
        console.error(err);
        setLoading(false);
        showMessage(err.message || 'Could not update your password.');
      }
    });

  })();
</script>
<script src="ripple.js" defer></script>

</body>
</html>
